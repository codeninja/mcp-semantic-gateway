site_name: MCP Semantic Gateway
theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: indigo
  features:
    - content.code.copy
    - navigation.sections
    - navigation.tabs

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          setup_commands:
            - import sys
            - sys.path.append("src")

nav:
  - Home: index.md
  - Guide: guide.md
  - API Reference:
      - Overview: api/index.md
      - Core: api/core.md
      - Ingestion: api/ingestion.md
      - Integration: api/integration.md
  - Contributing: contributing.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
