site_name: MCP Semantic Gateway
site_description: Semantic Tool Discovery Middleware for MCP
repo_url: https://github.com/codeninja/mcp-semantic-gateway
repo_name: codeninja/mcp-semantic-gateway

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: indigo
  features:
    - content.code.copy
    - navigation.sections
    - navigation.tabs

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true

nav:
  - Home: index.md
  - Guide: guide.md
  - API Reference:
      - Overview: api/index.md
      - Core: api/core.md
      - Ingestion: api/ingestion.md
      - Integration: api/integration.md
  - Design:
      - Use-Case Synthesis: design/use-case-synthesis.md
      - Skill Generation: design/skill-generation.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
